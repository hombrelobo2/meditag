# Compila el APK firmado en cada cambio y lo publica en "Releases".
# - Cada versión tiene su propia publicación: vX.Y.Z con MediTag-vX.Y.Z.apk
# - La publicación "ultima" es un enlace fijo (lo usan el QR de la guía y el botón
#   "Buscar actualizaciones" de la app) con MediTag.apk y version.json
# La versión se define en app/build.gradle.kts (versionName / versionCode).

name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Una compilación cada vez, para que no se pisen al publicar
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Leer la versión
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"
          echo "APK=MediTag-v$VERSION.apk" >> "$GITHUB_ENV"
          echo "Versión: $VERSION ($VCODE)"

      - name: Compilar APK firmado
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos SIGNING_* en Settings > Secrets and variables > Actions"
            exit 1
          fi
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$SIGNING_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp "$APK" MediTag.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediTag-v${{ env.VERSION }}
          path: ${{ env.APK }}

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="MediTag $VERSION (commit ${GITHUB_SHA::7}). Descarga $APK e instálalo encima de la versión anterior."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Misma versión recompilada: se reemplaza el APK
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "MediTag $VERSION" --notes "$NOTES" --latest
          fi

      - name: Actualizar el enlace fijo (QR de la guía y Buscar actualizaciones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lo consulta la app en "Acerca de → Buscar actualizaciones"
          # apkUrl: APK de esta versión con su número en el nombre (lo descarga la app)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/$APK"
          printf '{"versionName":"%s","versionCode":%s,"apkUrl":"%s"}\n' "$VERSION" "$VCODE" "$URL" > version.json
          cat version.json
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima "$APK" MediTag.apk version.json \
            --title "Enlace fijo a la última versión ($VERSION)" \
            --notes "Última versión ($VERSION): descarga $APK. MediTag.apk es la misma versión con nombre fijo, solo para el código QR de la guía impresa. version.json lo usa la app para avisar de versiones nuevas. Para ver el historial de versiones, mira las publicaciones vX.Y.Z." \
            --latest=false
