name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK firmado
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos SIGNING_* en Settings > Secrets and variables > Actions"
            exit 1
          fi
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$SIGNING_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk MediTag.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediTag-apk
          path: MediTag.apk

      - name: Publicar en Releases (última versión)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima MediTag.apk \
            --title "MediTag (última compilación)" \
            --notes "APK firmado, compilado desde ${GITHUB_SHA::7}. Descárgalo en el móvil e instálalo."
