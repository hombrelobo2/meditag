name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk MediTag.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediTag-apk
          path: MediTag.apk

      - name: Publicar en Releases (última versión)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima MediTag.apk \
            --title "MediTag (última compilación)" \
            --notes "APK de prueba compilado desde ${GITHUB_SHA::7}. Descárgalo en el móvil e instálalo."
